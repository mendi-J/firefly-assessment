name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: python -m pytest tests/ -v
    
    - name: Build package
      run: |
        # Create release directory
        mkdir -p release/firefly-analyzer
        
        # Copy source files
        cp *.py release/firefly-analyzer/
        cp requirements.txt release/firefly-analyzer/
        cp README.md release/firefly-analyzer/
        cp -r examples release/firefly-analyzer/
        
        # Create archive
        cd release
        tar -czf firefly-analyzer.tar.gz firefly-analyzer/
        zip -r firefly-analyzer.zip firefly-analyzer/
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          release/firefly-analyzer.tar.gz
          release/firefly-analyzer.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
