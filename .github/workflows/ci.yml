name: Firefly CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy
        pip install -r requirements.txt
    
    - name: Run Black (Code Formatter Check)
      run: black --check --diff .
      continue-on-error: true
    
    - name: Run Flake8 (Linter)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
    
    - name: Run Flake8 (Warnings)
      run: flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run pytest
      run: |
        python -m pytest tests/ -v --tb=short --junitxml=test-results-${{ matrix.python-version }}.xml
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results-${{ matrix.python-version }}.xml

  test-with-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests with coverage
      run: |
        python -m pytest tests/ --cov=. --cov-report=xml --cov-report=html --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true
    
    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  functional-test:
    name: Functional Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run analyzer on example data
      run: |
        python main.py \
          --cloud examples/cloud_resources.json \
          --iac examples/iac_resources.json \
          --output report.json \
          --pretty
    
    - name: Validate output
      run: |
        # Check if report was generated
        test -f report.json
        
        # Check if report is valid JSON
        python -c "import json; json.load(open('report.json'))"
        
        # Check if report has expected structure
        python -c "
        import json
        data = json.load(open('report.json'))
        assert isinstance(data, list), 'Report should be a list'
        assert len(data) > 0, 'Report should not be empty'
        for item in data:
            assert 'CloudResourceItem' in item
            assert 'IacResourceItem' in item
            assert 'State' in item
            assert 'ChangeLog' in item
            assert item['State'] in ['Missing', 'Match', 'Modified']
        print('✅ Report validation passed!')
        "
    
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: analysis-report
        path: report.json

  integration-test:
    name: Integration Test with LocalStack
    runs-on: ubuntu-latest
    continue-on-error: true  # Don't fail the pipeline if integration test fails
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install boto3
    
    - name: Start LocalStack
      run: |
        echo "====== Starting LocalStack ======"
        docker compose up -d localstack
        
        # Wait for LocalStack to be ready
        echo "====== Waiting for LocalStack to start ======"
        sleep 10
        
        # Check if LocalStack is running
        echo "====== Checking Docker containers ======"
        docker ps
        
        # Check LocalStack logs
        echo "====== LocalStack logs ======"
        docker compose logs localstack | tail -20
        
        # Wait for S3 service to be available
        echo "====== Checking S3 service availability ======"
        for i in {1..30}; do
          echo "Attempt $i/30: Checking health endpoint..."
          HEALTH=$(curl -s http://localhost:4566/_localstack/health || echo "failed")
          echo "Health response: $HEALTH"
          
          if echo "$HEALTH" | grep -q '"s3".*"available"'; then
            echo "✅ LocalStack S3 is ready!"
            break
          fi
          
          if [ $i -eq 30 ]; then
            echo "❌ LocalStack failed to become ready after 30 attempts"
            echo "====== Full LocalStack logs ======"
            docker compose logs localstack
            exit 1
          fi
          
          sleep 2
        done
    
    - name: Run analyzer and upload to S3
      run: |
        echo "====== Generating analysis report ======"
        python main.py \
          --cloud examples/cloud_resources.json \
          --iac examples/iac_resources.json \
          --output report.json \
          --pretty
        
        echo "====== Verifying report was created ======"
        ls -lh report.json
        echo "====== Report preview ======"
        head -20 report.json
        
        echo "====== Uploading to LocalStack S3 ======"
        python s3_uploader.py \
          --file report.json \
          --bucket firefly-reports \
          --endpoint http://localhost:4566 \
          --create-bucket
        
        echo "✅ Upload completed successfully"
    
    - name: Verify S3 upload
      run: |
        echo "====== Listing reports in S3 bucket ======"
        python s3_uploader.py \
          --bucket firefly-reports \
          --endpoint http://localhost:4566 \
          --list
        
        echo "====== Downloading report from S3 to verify ======"
        curl -s http://localhost:4566/firefly-reports/reports/report.json | python -m json.tool | head -10
        
        echo "✅ Integration test completed successfully!"
    
    - name: Cleanup
      if: always()
      run: |
        echo "====== Cleaning up LocalStack ======"
        docker compose logs localstack | tail -50
        docker compose down -v
        echo "✅ Cleanup completed"

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, test, test-with-coverage, functional-test, integration-test]
    if: always()
    
    steps:
    - name: Check results
      run: |
        echo "## 🚀 Pipeline Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ All checks completed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Jobs Status:" >> $GITHUB_STEP_SUMMARY
        echo "- Linting: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage: ${{ needs.test-with-coverage.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Functional Test: ${{ needs.functional-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Test: ${{ needs.integration-test.result }}" >> $GITHUB_STEP_SUMMARY
